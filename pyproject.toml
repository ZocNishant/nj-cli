[tool.poetry]
name = "nj-cli"
version = "0.1.0"
description = "AI-powered job hunting CLI"
authors = ["Nishant Joshi <zocnishant@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "nj"}]

[tool.poetry.scripts]
nj = "nj.cli.app:main_entry"

[tool.poetry.dependencies]
python = "^3.11"
typer = {extras = ["all"], version = ">=0.9"}
pydantic = {extras = ["email"], version = ">=2.0"}
pydantic-settings = ">=2.0"
sqlalchemy = ">=2.0"
alembic = ">=1.13"
python-dotenv = ">=1.0"
httpx = ">=0.27"
playwright = ">=1.44"
anthropic = ">=0.28"
python-docx = ">=1.1"
pyyaml = ">=6.0"
rich = ">=13.0"
gnureadline = ">=8.2.13"
structlog = ">=24.0"
readchar = ">=4.0"
beautifulsoup4 = ">=4.12"
openai = ">=1.0.0"
scikit-learn = ">=1.3.0"
scipy = ">=1.11.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
respx = ">=0.21"
pytest-mock = ">=3.14"
# CI runs `pytest --cov`, which needs the plugin, not just the coverage lib.
pytest-cov = ">=5.0"
# Pinned: ruff's default rule set changes between minor versions, so an
# unpinned range means CI can start failing on a commit that changed nothing.
ruff = "==0.15.14"
mypy = ">=1.10"
coverage = ">=7.0"
pre-commit = "^4.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Stated explicitly rather than inherited, so a ruff upgrade changes the
# pinned version deliberately instead of silently widening what CI enforces.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
    "B008",  # typer declares defaults via function calls in signatures
    # Deliberate deferrals, not permanent exemptions:
    "UP042",  # str+Enum -> StrEnum; mechanical but touches every Pydantic model
    "B904",   # `raise ... from err`; worth doing, no behavioural impact
]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
