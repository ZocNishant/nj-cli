[tool.poetry]
name = "nj-cli"
version = "0.1.0"
description = "AI-powered job hunting CLI"
authors = ["Nishant Joshi <zocnishant@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "nj"}]

[tool.poetry.scripts]
nj = "nj.cli.app:app"

[tool.poetry.dependencies]
python = "^3.11"
typer = {extras = ["all"], version = ">=0.9"}
pydantic = {extras = ["email"], version = ">=2.0"}
pydantic-settings = ">=2.0"
sqlalchemy = ">=2.0"
alembic = ">=1.13"
python-dotenv = ">=1.0"
httpx = ">=0.27"
playwright = ">=1.44"
anthropic = ">=0.28"
python-docx = ">=1.1"
pyyaml = ">=6.0"
rich = ">=13.0"
structlog = ">=24.0"
readchar = ">=4.0"
beautifulsoup4 = ">=4.12"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
respx = ">=0.21"
pytest-mock = ">=3.14"
ruff = ">=0.4"
black = ">=24.0"
mypy = ">=1.10"
coverage = ">=7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
