repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # Pinned to the same version as pyproject.toml — ruff's default rule set
  # changes between minor versions, so an unpinned hook drifts from CI.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: no-env-file
        name: No .env in commit
        entry: bash -c 'if git ls-files --error-unmatch .env 2>/dev/null;
          then echo "ERROR .env committed"; exit 1; fi'
        language: system
        pass_filenames: false
      - id: no-config-yaml
        name: No config.yaml in commit
        entry: bash -c 'if git ls-files --error-unmatch config.yaml
          2>/dev/null; then echo "ERROR config.yaml committed";
          exit 1; fi'
        language: system
        pass_filenames: false
