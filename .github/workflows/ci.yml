name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint
        run: poetry run ruff check nj/ tests/

      - name: Check formatting
        run: poetry run ruff format --check nj/ tests/

      - name: Run tests
        run: |
          poetry run pytest tests/ \
            --tb=short \
            --cov=nj \
            --cov-report=term-missing \
            --cov-fail-under=70

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks needs history to scan commits, not just the tip.
          fetch-depth: 0

      # The previous check only asserted that .env and config.yaml were absent,
      # which says nothing about a key pasted into a source file or committed
      # and later removed. This scans content across history instead.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert local-only files are untracked
        run: |
          for f in .env config.yaml cv/cv_base.json .git-secret-replacements.txt; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "ERROR: $f is tracked by git and must not be"
              exit 1
            fi
          done
