name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-interaction

      # tectonic is not a Python package, so `poetry install` cannot supply it.
      # nj/tailoring/renderer.py shells out to it, and cmd_run swallows a render
      # failure as a logger.warning — so without this step a broken CV template
      # looks like a successful run that happens to produce no PDF.
      #
      # Installed from the upstream release rather than apt: tectonic is not in
      # noble proper, only noble-updates/backports, so `apt-get install` is not
      # a stable contract. The musl build is statically linked and pinned.
      - name: Install tectonic
        env:
          TECTONIC_VERSION: "0.17.0"
        run: |
          curl -fsSL \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar xz -C /usr/local/bin tectonic
          tectonic --version

      - name: Lint
        run: poetry run ruff check nj/ tests/

      - name: Check formatting
        run: poetry run ruff format --check nj/ tests/

      - name: Run tests
        # NJ_REQUIRE_TECTONIC turns "tectonic is missing" from a skip into a
        # failure. The template compile tests skip on a laptop without a LaTeX
        # toolchain, which is right for local work and wrong for CI — a silently
        # skipped check is how the 0-byte template survived for months.
        env:
          NJ_REQUIRE_TECTONIC: "1"
        # cov-fail-under is a ratchet, not a target: it sits just under actual
        # coverage so a PR that drops it fails, and is raised deliberately as
        # coverage improves. It was set to 70 against real coverage of 56, which
        # meant the gate could never pass — invisible until the lint step in
        # front of it started passing.
        #
        # Raised 55 -> 62 on 2026-08-18 against real coverage of 65%. Two things
        # earned it: extracting nj/pipeline/ made the orchestration testable
        # without going through Typer, and graph/ml/intel/watch/update-role got
        # smoke tests — all five had been at 0%, meaning nothing had ever run
        # them in CI. The remaining gaps are nj/integrations and nj/cli/shell.
        run: |
          poetry run pytest tests/ \
            --tb=short \
            --cov=nj \
            --cov-report=term-missing \
            --cov-fail-under=62

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks needs history to scan commits, not just the tip.
          fetch-depth: 0

      # The previous check only asserted that .env and config.yaml were absent,
      # which says nothing about a key pasted into a source file or committed
      # and later removed. This scans content across history instead.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert local-only files are untracked
        run: |
          for f in .env config.yaml cv/cv_base.json .git-secret-replacements.txt; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "ERROR: $f is tracked by git and must not be"
              exit 1
            fi
          done
